name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check trailing newlines
        run: npm run check:whitespace

      - name: Verify register schema lock
        run: npm run verify:register-schema-lock

      - name: Lint application and Convex code
        run: npm run lint

      # Fails the job if lines, statements, functions, or branches drop below 90%.
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Typecheck application and Convex schema
        run: npm run typecheck

      - name: Build production application
        env:
          VITE_CONVEX_URL: https://standing-manatee-425.convex.cloud
        run: npm run build
